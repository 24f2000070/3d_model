<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #111;
        }
    </style>
</head>

<body>

    <model-viewer
        src="./model.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        interaction-prompt="auto">
    </model-viewer>

</body>
</html>
